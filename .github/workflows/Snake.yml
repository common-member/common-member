# GitHubのコントリビューション履歴からSnake画像を生成・更新する
name: generate animation

# 定期実行・手動実行・mainへのpushを起点にする
on:
  schedule:
    # 日本時間の0時・4時・8時・12時・16時・20時に実行
    - cron: "0 */4 * * *"
      timezone: "Asia/Tokyo"

  # GitHubのActions画面から手動でも実行できる
  workflow_dispatch:

  # mainへ変更が反映されたときに実行する
  push:
    branches:
      - main

jobs:
  # Snake画像を生成し、公開用のoutputブランチへ反映する
  generate:
    # outputブランチへコミットするため、リポジトリへの書き込みを許可する
    permissions:
      contents: write
    runs-on: ubuntu-latest
    # 予期しない停止による長時間実行を防ぐ
    timeout-minutes: 5
    steps:
      # リポジトリ所有者のコントリビューション履歴からSVGを生成する
      - name: generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          # リポジトリの所有者名を自動的に使用する
          github_user_name: ${{ github.repository_owner }}
          # GitHubのライト・ダークテーマに対応した2種類を出力する
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # 生成したdistディレクトリをoutputブランチへ反映する
      - name: push contribution snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
          # 画像に変更がない場合は空コミットを作成しない
          allow_empty_commit: false
          commit_message: "chore: update contribution snake"
        env:
          # GitHubがワークフローごとに発行するトークンを使用する
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
